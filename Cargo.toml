[package]
name = "ghostline-item-builder"
version = "0.1.0"
edition = "2024"
description = "Standalone Cyberpunk 2077 item mod authoring"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
ghostline-red = { path = "../ghostline-red" }
ghostline-renderer = { path = "../renderer" }
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
zip = { version = "2", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.release]
debug = 1
